<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Help</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card: #111827cc;
            --primary: #6366f1;
            --primary-2: #8b5cf6;
            --text: #e5e7eb;
            --muted: #9ca3af;
            --success: #22c55e;
            --error: #ef4444;
            --border: #1f2937;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
            color: var(--text);
            background: radial-gradient(1200px 800px at 10% -10%, #1f2937, transparent 60%),
                        radial-gradient(1200px 800px at 110% 10%, #0b1020, transparent 60%),
                        linear-gradient(135deg, #0f172a 0%, #0b1020 100%);
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .auth-shell {
            width: 100%;
            max-width: 420px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            color: var(--text);
        }
        .brand-logo {
            width: 36px; height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            display: grid; place-items: center;
            box-shadow: 0 8px 30px rgba(99, 102, 241, .35);
            font-weight: 700;
        }
        .card {
            background: linear-gradient(180deg, rgba(17,24,39,.9), rgba(17,24,39,.8));
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.03);
        }
        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #0b1220;
            border: 1px solid var(--border);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 18px;
            gap: 6px;
        }
        .tab-btn {
            appearance: none;
            border: 0;
            background: transparent;
            color: var(--muted);
            padding: 10px 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }
        .tab-btn.active {
            color: var(--text);
            background: linear-gradient(135deg, rgba(99,102,241,.25), rgba(139,92,246,.25));
            border: 1px solid rgba(99,102,241,.35);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 4px 20px rgba(99,102,241,.22);
        }
        .title {
            margin: 0 0 6px 0;
            font-size: 22px;
            font-weight: 700;
        }
        .subtitle { margin: 0 0 16px 0; color: var(--muted); font-size: 14px; }
        .field { margin-bottom: 12px; }
        label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 13px; }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px 12px;
            border-radius: 10px;
            background: #0b1220;
            color: var(--text);
            border: 1px solid var(--border);
            outline: none;
            font-size: 14px;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        input:focus {
            border-color: rgba(99,102,241,.6);
            box-shadow: 0 0 0 3px rgba(99,102,241,.15);
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: white;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(99,102,241,.35);
            margin-top: 6px;
        }
        .btn:hover { filter: brightness(1.05); }
        .btn:active { transform: translateY(1px); }
        .message { margin-top: 10px; font-size: 13px; min-height: 18px; }
        .message.error { color: var(--error); }
        .message.success { color: var(--success); }
        .hint { margin-top: 14px; color: var(--muted); font-size: 13px; text-align: center; }
        .hint .link { color: #a5b4fc; text-decoration: underline; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="auth-shell">
        <div class="brand">
            <div class="brand-logo">H</div>
            <div>
                <div style="font-weight:700; line-height: 1.2;">Hostel Help</div>
                <div style="font-size: 12px; color: var(--muted);">Complaint & Management Portal</div>
            </div>
        </div>

        <div class="card">
            <div class="tabs">
                <button id="tab-login" class="tab-btn active" type="button">Sign in</button>
                <button id="tab-signup" class="tab-btn" type="button">Sign up</button>
            </div>

            <div id="login-view">
                <h2 class="title">Welcome back</h2>
                <p class="subtitle">Sign in to continue to your dashboard</p>
                <form id="login-form">
                    <div class="field">
                        <label for="login-email">Email</label>
                        <input id="login-email" type="email" placeholder="you@example.com" required>
                    </div>
                    <div class="field">
                        <label for="login-password">Password</label>
                        <input id="login-password" type="password" placeholder="Enter your password" required>
                    </div>
                    <button class="btn" type="submit">Sign in</button>
                    <div id="login-message" class="message"></div>
                </form>
                <p class="hint">Don't have an account? <span class="link" id="inline-to-signup">Create one</span></p>
            </div>

            <div id="signup-view" class="hidden">
                <h2 class="title">Create account</h2>
                <p class="subtitle">Get started with a free account</p>
                <form id="signup-form">
                    <div class="field">
                        <label for="signup-name">Full Name</label>
                        <input id="signup-name" type="text" placeholder="John Doe" required>
                    </div>
                    <div class="field">
                        <label for="signup-email">Email</label>
                        <input id="signup-email" type="email" placeholder="you@example.com" required>
                    </div>
                    <div class="field">
                        <label for="signup-password">Password</label>
                        <input id="signup-password" type="password" placeholder="Create a password (min 6 chars)" required>
                    </div>
                    <div class="field">
                        <label for="signup-confirm">Confirm password</label>
                        <input id="signup-confirm" type="password" placeholder="Re-enter password" required>
                    </div>
                    <button class="btn" type="submit">Sign up</button>
                    <div id="signup-message" class="message"></div>
                </form>
                <p class="hint">Already have an account? <span class="link" id="inline-to-login">Sign in</span></p>
            </div>
        </div>
    </div>

    <script>
        const loginView = document.getElementById('login-view');
        const signupView = document.getElementById('signup-view');
        const tabLogin = document.getElementById('tab-login');
        const tabSignup = document.getElementById('tab-signup');
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const loginMessage = document.getElementById('login-message');
        const signupMessage = document.getElementById('signup-message');

        function showLogin() {
            loginView.classList.remove('hidden');
            signupView.classList.add('hidden');
            tabLogin.classList.add('active');
            tabSignup.classList.remove('active');
        }
        function showSignup() {
            signupView.classList.remove('hidden');
            loginView.classList.add('hidden');
            tabSignup.classList.add('active');
            tabLogin.classList.remove('active');
        }
        tabLogin.addEventListener('click', showLogin);
        tabSignup.addEventListener('click', showSignup);
        document.getElementById('inline-to-signup').addEventListener('click', showSignup);
        document.getElementById('inline-to-login').addEventListener('click', showLogin);

        // Auto-redirect if already logged in
        try {
            const existing = localStorage.getItem('hms_current_user');
            if (existing) {
                window.location.href = 'index.html';
            }
        } catch (_) {}

        // Auth: Login via Better Auth
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value.trim();
            loginMessage.className = 'message';
            loginMessage.textContent = 'Logging in...';
            try {
                const res = await fetch('/api/auth/sign-in/email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });
                if (res.ok) {
                    const data = await res.json();
                    const user = data.user || data;
                    const token = data.token || data.session?.token;
                    try {
                        localStorage.setItem('hms_current_user', user.email);
                        localStorage.setItem('hms_user_role', user.role || (user.email === 'admin@hostel.com' ? 'admin' : 'user'));
                        if (token) localStorage.setItem('hms_token', token);
                    } catch (_) {}
                    window.location.replace('index.html');
                } else {
                    const err = await res.json().catch(() => ({ message: 'Login failed' }));
                    loginMessage.className = 'message error';
                    loginMessage.textContent = err.message || err.error || 'Invalid email or password';
                }
            } catch (err) {
                loginMessage.className = 'message error';
                loginMessage.textContent = 'Network error. Please try again.';
            }
        });

        // Auth: Signup via Better Auth
        signupForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim().toLowerCase();
            const pass = document.getElementById('signup-password').value;
            const conf = document.getElementById('signup-confirm').value;

            if (pass.length < 6) {
                signupMessage.className = 'message error';
                signupMessage.textContent = 'Password must be at least 6 characters.';
                return;
            }
            if (pass !== conf) {
                signupMessage.className = 'message error';
                signupMessage.textContent = 'Passwords do not match.';
                return;
            }

            signupMessage.className = 'message';
            signupMessage.textContent = 'Creating account...';
            try {
                const res = await fetch('/api/auth/sign-up/email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        name: name || email.split('@')[0],
                        email,
                        password: pass
                    })
                });
                if (res.ok) {
                    const data = await res.json();
                    const user = data.user || data;
                    const token = data.token || data.session?.token;
                    try {
                        localStorage.setItem('hms_current_user', user.email);
                        localStorage.setItem('hms_user_role', user.role || 'user');
                        if (token) localStorage.setItem('hms_token', token);
                    } catch (_) {}
                    signupMessage.className = 'message success';
                    signupMessage.textContent = 'Account created successfully! Redirecting...';
                    setTimeout(() => { window.location.replace('index.html'); }, 600);
                } else {
                    const err = await res.json().catch(() => ({ message: 'Signup failed' }));
                    signupMessage.className = 'message error';
                    signupMessage.textContent = err.message || err.error || 'Signup failed';
                }
            } catch (err) {
                signupMessage.className = 'message error';
                signupMessage.textContent = 'Network error. Please try again.';
            }
        });
    </script>
</body>
</html>
