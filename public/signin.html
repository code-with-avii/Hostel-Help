<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Help — Authentication</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-base: #090d16;
            --card: rgba(18, 25, 42, 0.82);
            --primary: #6366f1;
            --primary-2: #8b5cf6;
            --primary-glow: rgba(99, 102, 241, 0.28);
            --text: #f1f5f9;
            --muted: #94a3b8;
            --dim: #64748b;
            --success: #10b981;
            --error: #f43f5e;
            --border: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(99, 102, 241, 0.6);
            --radius-md: 12px;
            --radius-lg: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text);
            background: radial-gradient(1200px 800px at 15% -10%, rgba(99, 102, 241, 0.15), transparent 60%),
                        radial-gradient(1100px 700px at 85% 10%, rgba(139, 92, 246, 0.12), transparent 55%),
                        linear-gradient(180deg, #090d16 0%, #060911 100%);
            display: grid;
            place-items: center;
            padding: 24px;
            min-height: 100vh;
        }
        .auth-shell {
            width: 100%;
            max-width: 420px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .brand-logo {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            display: grid;
            place-items: center;
            box-shadow: 0 4px 16px var(--primary-glow);
            padding: 6px;
            flex-shrink: 0;
        }
        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .brand-title {
            font-size: 19px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }
        .brand-subtitle {
            font-size: 12px;
            color: var(--muted);
            font-weight: 500;
        }
        .card {
            background: var(--card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px 24px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #0b1220;
            border: 1px solid var(--border);
            padding: 4px;
            border-radius: var(--radius-md);
            margin-bottom: 22px;
            gap: 6px;
        }
        .tab-btn {
            appearance: none;
            border: 0;
            background: transparent;
            color: var(--muted);
            padding: 10px 14px;
            border-radius: 9px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .tab-btn.active {
            color: #ffffff;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.28), rgba(139, 92, 246, 0.28));
            border: 1px solid rgba(99, 102, 241, 0.4);
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.22);
        }
        .title {
            margin: 0 0 6px 0;
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.02em;
        }
        .subtitle {
            margin: 0 0 20px 0;
            color: var(--muted);
            font-size: 13.5px;
            line-height: 1.4;
        }
        .field {
            margin-bottom: 14px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 12.5px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--dim);
            font-size: 14px;
            pointer-events: none;
            transition: color 0.2s ease;
        }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 11px 14px 11px 40px;
            border-radius: 10px;
            background: #0b1220;
            color: var(--text);
            border: 1px solid var(--border);
            outline: none;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }
        input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
        }
        .input-wrap:focus-within .input-icon {
            color: var(--primary);
        }
        .btn {
            width: 100%;
            padding: 12px 16px;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: white;
            font-weight: 700;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 6px 20px var(--primary-glow);
            margin-top: 8px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
        }
        .btn:active {
            transform: translateY(1px);
        }
        .message {
            margin-top: 12px;
            font-size: 13px;
            font-weight: 600;
            min-height: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .message.error { color: var(--error); }
        .message.success { color: var(--success); }
        .hint {
            margin-top: 18px;
            color: var(--muted);
            font-size: 13px;
            text-align: center;
        }
        .hint .link {
            color: #a5b4fc;
            text-decoration: underline;
            cursor: pointer;
            font-weight: 600;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="auth-shell">
        <div class="brand">
            <div class="brand-logo">
                <img src="logo.svg" alt="Hostel Help Logo" />
            </div>
            <div>
                <div class="brand-title">Hostel Help</div>
                <div class="brand-subtitle">Student Support & Maintenance Portal</div>
            </div>
        </div>

        <div class="card">
            <div class="tabs">
                <button id="tab-login" class="tab-btn active" type="button">
                    <i class="fas fa-arrow-right-to-bracket"></i> Sign in
                </button>
                <button id="tab-signup" class="tab-btn" type="button">
                    <i class="fas fa-user-plus"></i> Sign up
                </button>
            </div>

            <!-- Login View -->
            <div id="login-view">
                <h2 class="title">Welcome back</h2>
                <p class="subtitle">Enter your credentials to access your hostel dashboard.</p>
                <form id="login-form">
                    <div class="field">
                        <label for="login-email">Hostel / Student Email</label>
                        <div class="input-wrap">
                            <i class="fas fa-envelope input-icon"></i>
                            <input id="login-email" type="email" placeholder="you@example.com" required autocomplete="email">
                        </div>
                    </div>
                    <div class="field">
                        <label for="login-password">Password</label>
                        <div class="input-wrap">
                            <i class="fas fa-lock input-icon"></i>
                            <input id="login-password" type="password" placeholder="Enter your password" required autocomplete="current-password">
                        </div>
                    </div>
                    <button class="btn" type="submit">
                        <i class="fas fa-arrow-right-to-bracket"></i> Sign in
                    </button>
                    <div id="login-message" class="message"></div>
                </form>
                <p class="hint">Don't have an account? <span class="link" id="inline-to-signup">Create one now</span></p>
            </div>

            <!-- Signup View -->
            <div id="signup-view" class="hidden">
                <h2 class="title">Create resident account</h2>
                <p class="subtitle">Sign up to file complaints and track hostel maintenance tickets.</p>
                <form id="signup-form">
                    <div class="field">
                        <label for="signup-name">Full Name</label>
                        <div class="input-wrap">
                            <i class="fas fa-user input-icon"></i>
                            <input id="signup-name" type="text" placeholder="e.g. John Doe" required autocomplete="name">
                        </div>
                    </div>
                    <div class="field">
                        <label for="signup-email">Email Address</label>
                        <div class="input-wrap">
                            <i class="fas fa-envelope input-icon"></i>
                            <input id="signup-email" type="email" placeholder="you@example.com" required autocomplete="email">
                        </div>
                    </div>
                    <div class="field">
                        <label for="signup-password">Password</label>
                        <div class="input-wrap">
                            <i class="fas fa-lock input-icon"></i>
                            <input id="signup-password" type="password" placeholder="Create a password (min 6 chars)" required autocomplete="new-password">
                        </div>
                    </div>
                    <div class="field">
                        <label for="signup-confirm">Confirm Password</label>
                        <div class="input-wrap">
                            <i class="fas fa-shield-halved input-icon"></i>
                            <input id="signup-confirm" type="password" placeholder="Re-enter password" required autocomplete="new-password">
                        </div>
                    </div>
                    <button class="btn" type="submit">
                        <i class="fas fa-user-plus"></i> Create Account
                    </button>
                    <div id="signup-message" class="message"></div>
                </form>
                <p class="hint">Already have an account? <span class="link" id="inline-to-login">Sign in</span></p>
            </div>
        </div>
    </div>

    <script>
        const loginView = document.getElementById('login-view');
        const signupView = document.getElementById('signup-view');
        const tabLogin = document.getElementById('tab-login');
        const tabSignup = document.getElementById('tab-signup');
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const loginMessage = document.getElementById('login-message');
        const signupMessage = document.getElementById('signup-message');

        function showLogin() {
            loginView.classList.remove('hidden');
            signupView.classList.add('hidden');
            tabLogin.classList.add('active');
            tabSignup.classList.remove('active');
        }
        function showSignup() {
            signupView.classList.remove('hidden');
            loginView.classList.add('hidden');
            tabSignup.classList.add('active');
            tabLogin.classList.remove('active');
        }
        tabLogin.addEventListener('click', showLogin);
        tabSignup.addEventListener('click', showSignup);
        document.getElementById('inline-to-signup').addEventListener('click', showSignup);
        document.getElementById('inline-to-login').addEventListener('click', showLogin);

        // Auto-redirect if already logged in
        try {
            const existing = localStorage.getItem('hms_current_user');
            if (existing) {
                window.location.href = 'index.html';
            }
        } catch (_) {}

        // Auth: Login via Better Auth
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value.trim();
            loginMessage.className = 'message';
            loginMessage.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
            try {
                const res = await fetch('/api/auth/sign-in/email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok) {
                    const user = data.user || data;
                    const token = data.token || data.session?.token;
                    try {
                        localStorage.setItem('hms_current_user', user.email);
                        localStorage.setItem('hms_user_role', user.role || (user.email === 'admin@hostel.com' ? 'admin' : 'user'));
                        if (token) localStorage.setItem('hms_token', token);
                    } catch (_) {}
                    loginMessage.className = 'message success';
                    loginMessage.innerHTML = '<i class="fas fa-circle-check"></i> Success! Redirecting...';
                    window.location.replace('index.html');
                } else {
                    loginMessage.className = 'message error';
                    loginMessage.innerHTML = `<i class="fas fa-circle-exclamation"></i> ${data.message || data.error || 'Invalid email or password'}`;
                }
            } catch (err) {
                loginMessage.className = 'message error';
                loginMessage.innerHTML = '<i class="fas fa-triangle-exclamation"></i> Network error. Please try again.';
            }
        });

        // Auth: Signup via Better Auth
        signupForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim().toLowerCase();
            const pass = document.getElementById('signup-password').value;
            const conf = document.getElementById('signup-confirm').value;

            if (pass.length < 6) {
                signupMessage.className = 'message error';
                signupMessage.innerHTML = '<i class="fas fa-circle-exclamation"></i> Password must be at least 6 characters.';
                return;
            }
            if (pass !== conf) {
                signupMessage.className = 'message error';
                signupMessage.innerHTML = '<i class="fas fa-circle-exclamation"></i> Passwords do not match.';
                return;
            }

            signupMessage.className = 'message';
            signupMessage.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
            try {
                const res = await fetch('/api/auth/sign-up/email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        name: name || email.split('@')[0],
                        email,
                        password: pass
                    })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok) {
                    const user = data.user || data;
                    const token = data.token || data.session?.token;
                    try {
                        localStorage.setItem('hms_current_user', user.email);
                        localStorage.setItem('hms_user_role', user.role || 'user');
                        if (token) localStorage.setItem('hms_token', token);
                    } catch (_) {}
                    signupMessage.className = 'message success';
                    signupMessage.innerHTML = '<i class="fas fa-circle-check"></i> Account created! Redirecting to dashboard...';
                    setTimeout(() => { window.location.replace('index.html'); }, 500);
                } else {
                    signupMessage.className = 'message error';
                    signupMessage.innerHTML = `<i class="fas fa-circle-exclamation"></i> ${data.message || data.error || 'Signup failed'}`;
                }
            } catch (err) {
                signupMessage.className = 'message error';
                signupMessage.innerHTML = '<i class="fas fa-triangle-exclamation"></i> Network error. Please try again.';
            }
        });
    </script>
</body>
</html>
